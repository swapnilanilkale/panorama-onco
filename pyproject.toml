[project]
name = "panorama-onco"
version = "0.0.1"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=2.0",
    "nibabel>=5.2",
    "scipy>=1.11",
    "torch>=2.3",
    "lightning>=2.3",
    "omegaconf>=2.3",
    "pydicom>=3.0",
    "requests>=2.31",
]
[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panorama"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]