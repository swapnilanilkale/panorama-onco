# MAE pretraining of the Aim 1 encoder.
# Override anything from the CLI:
#   python -m panorama.train.pretrain model.embed_dim=1024 data.batch_size=4

seed: 1337
output_dir: outputs/pretrain

data:
  manifest_path: data/manifests/cohort.csv
  data_root: data/raw
  crop_size: [32, 32, 32]        
  target_spacing: [1.5, 1.5, 1.5]
  batch_size: 2
  num_workers: 2
  patches_per_study: 4
  fg_threshold: 0.1
  val_fraction: 0.15
  test_fraction: 0.15

model:
  volume_shape: [96, 96, 96]
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  fusion_every: 4
  share_stream_weights: true
  mask_ratio: 0.75
  decoder_dim: 256
  decoder_depth: 2
  decoder_heads: 8
  norm_pix_loss: true
  base_lr: 1.5e-4          
  weight_decay: 0.05
  warmup_steps: 1000
  max_steps: 100000        

trainer:
  max_steps: 100000
  accelerator: auto
  devices: 1
  precision: 16-mixed
  accumulate_grad_batches: 8
  gradient_clip_val: 1.0
  val_check_interval: 500
  log_every_n_steps: 50